version: "3.9"

services:
  molscribe-api:
    build: ./services/molscribe-api
    ports: ["8001:8001"]
    volumes:
      - model-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  decimer-api:
    build: ./services/decimer-api
    ports: ["8002:8002"]
    volumes:
      - model-cache:/root/.data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  webui:
    build: ./webui
    ports: ["5173:5173"]
    depends_on:
      molscribe-api:
        condition: service_started
      decimer-api:
        condition: service_started

volumes:
  model-cache:
